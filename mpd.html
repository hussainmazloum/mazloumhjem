<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Majid TV</title>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
</head>
<body>

<video id="videoPlayer"
       controls
       autoplay
       style="width:100%;max-width:900px">
</video>

<script>
const url =
"https://admn-live-cdn-lb.starzplayarabia.com/out/v1/admn_tv/majid/majid_dash_enc/index.mpd";

const player = dashjs.MediaPlayer().create();
player.initialize(
    document.querySelector("#videoPlayer"),
    url,
    true
);

player.on("error", function(e){
    console.log("DASH Error:", e);
});
</script>

</body>
</html>
